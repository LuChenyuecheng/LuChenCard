<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3627">
<title>路辰 · 越城中学一卡通消费记录</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#1a1f1c;
  --faint:#9ca3af;
  --line:#e6e9e7;
  --line-soft:#f0f2f1;
  --green-deep:#0d3627;
  --green-mid:#14503c;
  --green:#15803d;
  --green-soft:#e8f3ed;
  --gold:#d4af5f;
  --orange:#c2410c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding:0 14px calc(44px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto}

.card-head{
  position:relative;
  margin-top:calc(16px + env(safe-area-inset-top));
  border-radius:20px;
  padding:22px 20px 20px;
  background:linear-gradient(150deg,#14503c 0%,#0f4030 45%,#0b2d20 100%);
  color:#eef4f0;
  box-shadow:0 16px 34px -18px rgba(13,54,39,.65);
  overflow:hidden;
  animation:fadeUp .55s cubic-bezier(.22,.8,.3,1) both;
}
.card-head::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(400px 170px at 88% -22%, rgba(212,175,95,.20), transparent 68%);
}
.card-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.chip{
  width:34px;height:26px;border-radius:6px;flex:0 0 auto;position:relative;
  background:linear-gradient(135deg,#e6c87e,#b9932f);
  box-shadow:0 2px 10px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.18);
}
.chip::before{
  content:'';position:absolute;left:8px;right:8px;top:9px;height:1px;
  background:rgba(70,45,5,.5);
  box-shadow:0 4px 0 rgba(70,45,5,.5), 0 8px 0 rgba(70,45,5,.5);
}
.brand{font-size:13.5px;letter-spacing:.08em;font-weight:600;color:#f2f7f4}
.brand em{font-style:normal;font-weight:400;font-size:11.5px;color:rgba(226,238,232,.62);letter-spacing:.04em}

.holder{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-top:24px;position:relative;z-index:1;
}
.holder .name{font-size:23px;font-weight:600;letter-spacing:.16em;color:#fff}
.holder .card-no{
  font-size:11.5px;color:rgba(226,238,232,.6);letter-spacing:.06em;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}

.balance{
  margin-top:20px;display:flex;align-items:flex-end;justify-content:space-between;
  position:relative;z-index:1;
}
.balance .label{font-size:11.5px;color:rgba(226,238,232,.6);letter-spacing:.14em;padding-bottom:5px}
.balance .value{
  font-size:31px;font-weight:700;line-height:1;color:var(--gold);
  text-shadow:0 0 24px rgba(212,175,95,.35);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.balance .value small{font-size:15px;margin-right:3px;opacity:.85;font-weight:600}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;margin-top:14px;
  background:var(--line);border:1px solid var(--line);
  border-radius:15px;overflow:hidden;
  animation:fadeUp .55s .06s cubic-bezier(.22,.8,.3,1) both;
}
.stat{background:#fff;padding:14px 6px;text-align:center}
.stat .val{
  font-size:15px;font-weight:700;color:var(--green-deep);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.stat .val.gold{color:#a37b18}
.stat .key{font-size:11px;color:var(--faint);margin-top:6px;letter-spacing:.08em}

.sec-title{
  display:flex;align-items:center;gap:10px;
  margin:26px 4px 12px;
  font-size:11.5px;color:var(--faint);letter-spacing:.14em;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}

.day{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 2px 10px -6px rgba(20,60,45,.10);
  animation:fadeUp .5s cubic-bezier(.22,.8,.3,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
.day-head{
  display:flex;align-items:center;gap:8px;
  padding:12px 15px;
  background:#f7faf8;
  border-bottom:1px solid var(--line-soft);
}
.day-head .date{
  font-size:13.5px;font-weight:700;color:var(--green-deep);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.day-head .weekday{
  font-size:11px;color:var(--green-mid);
  background:var(--green-soft);
  border-radius:5px;padding:1px 6px;
}
.day-head .day-total{margin-left:auto;font-size:12px;color:var(--orange);opacity:.9}

.items{list-style:none;padding:5px 0}
.item{
  display:grid;
  grid-template-columns:54px 12px 1fr auto;
  align-items:center;
  gap:12px;
  padding:9px 15px;
  position:relative;
}
.item::before{
  content:'';position:absolute;
  left:87px;top:0;bottom:0;width:1px;
  background:var(--line-soft);
}
.items li:first-child::before{top:50%}
.items li:last-child::before{bottom:50%}

.item .time{
  font-size:12.5px;color:var(--faint);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.item .dot{
  width:8px;height:8px;border-radius:50%;
  background:#cbd5d1;justify-self:center;position:relative;z-index:1;
}
.dot.open,.dot.recharge{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.dot.food{background:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.13)}
.dot.shop{background:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.13)}
.dot.library{background:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.dot.in,.dot.out{background:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.15)}

.item .text{
  font-size:14px;color:#374151;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.item .amount{
  font-size:14px;font-weight:600;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.amount.minus{color:var(--orange)}
.amount.plus{color:var(--green)}

.qr-panel{
  margin-top:22px;
  padding:18px;
  background:#f7faf8;
  border:1px solid var(--line);
  border-radius:16px;
  text-align:center;
}
.qr-panel .qr-box{
  display:inline-block;
  padding:12px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 14px -8px rgba(20,60,45,.35);
  line-height:0;
  min-width:150px;min-height:150px;
}
.qr-panel .qr-box img,
.qr-panel .qr-box canvas{display:block;margin:0 auto}
.qr-panel .qr-tip{
  margin-top:14px;
  font-size:12.5px;color:var(--green-mid);
  letter-spacing:.06em;
}
.qr-panel .qr-url{
  margin-top:6px;
  font-size:11px;color:var(--faint);
  word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}

.foot{
  text-align:center;margin-top:26px;
  font-size:11.5px;color:#b3bdb8;letter-spacing:.12em;
}
.foot b{color:var(--green-mid);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div class="card-head">
    <div class="card-top">
      <div class="chip"></div>
      <div class="brand">越城中学 · 校园一卡通 <em>· 交易明细</em></div>
    </div>

    <div class="holder">
      <div class="name">路 辰</div>
      <div class="card-no">NO.20150319</div>
    </div>

    <div class="balance">
      <div class="label">账户余额</div>
      <div class="value"><small>¥</small><b id="balanceValue">0.00</b></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="val gold" id="statSpend">¥0.00</div>
      <div class="key">累计消费</div>
    </div>
    <div class="stat">
      <div class="val" id="statCount">0 笔</div>
      <div class="key">消费笔数</div>
    </div>
    <div class="stat">
      <div class="val" id="statDays">0 天</div>
      <div class="key">记录天数</div>
    </div>
  </div>

  <div class="sec-title" id="dateRange">—</div>

  <div id="timeline"></div>

  <div class="qr-panel">
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-tip">扫码查看完整消费记录</div>
    <div class="qr-url" id="qrUrl"></div>
  </div>

  <div class="foot">— 越城中学 · 共 <b id="footCount">0</b> 条记录 —</div>
</div>

<script>
const RECORDS = [
  { date:'2015.09.01', weekday:'周二', items:[
    { time:'09:07', type:'open',     text:'开卡成功' },
    { time:'09:10', type:'recharge', text:'充值',            delta:  5000 },
    { time:'11:52', type:'food',     text:'食堂',            delta:   -10 },
    { time:'17:35', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:05', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.02', weekday:'周三', items:[
    { time:'07:22', type:'in',       text:'刷卡入校' },
    { time:'12:05', type:'food',     text:'食堂',            delta:   -15 },
    { time:'15:40', type:'shop',     text:'小卖部',          delta:    -3 },
    { time:'17:30', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:14', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.03', weekday:'周四', items:[
    { time:'07:35', type:'in',       text:'刷卡入校' },
    { time:'11:48', type:'food',     text:'食堂',            delta:   -11 },
    { time:'17:32', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:00', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.04', weekday:'周五', items:[
    { time:'07:18', type:'in',       text:'刷卡入校' },
    { time:'12:00', type:'food',     text:'食堂',            delta:   -10 },
    { time:'13:05', type:'library',  text:'图书馆  借阅《XXXX》' },
    { time:'18:34', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.07', weekday:'周一', items:[
    { time:'07:20', type:'in',       text:'刷卡入校' },
    { time:'11:55', type:'food',     text:'食堂',            delta:   -10 },
    { time:'17:35', type:'food',     text:'食堂',            delta:   -11 },
    { time:'20:10', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.08', weekday:'周二', items:[
    { time:'07:25', type:'in',       text:'刷卡入校' },
    { time:'11:50', type:'food',     text:'食堂',            delta:   -11 },
    { time:'15:35', type:'shop',     text:'小卖部',          delta:   -20 },
    { time:'17:30', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:05', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.09', weekday:'周三', items:[
    { time:'07:20', type:'in',       text:'刷卡入校' },
    { time:'11:45', type:'food',     text:'食堂',            delta:   -13 },
    { time:'17:32', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:09', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.10', weekday:'周四', items:[
    { time:'07:30', type:'in',       text:'刷卡入校' },
    { time:'11:55', type:'food',     text:'食堂',            delta:   -11 },
    { time:'17:30', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:11', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.11', weekday:'周五', items:[
    { time:'07:15', type:'in',       text:'刷卡入校' },
    { time:'11:50', type:'food',     text:'食堂',            delta:   -13 },
    { time:'14:50', type:'shop',     text:'小卖部',          delta:   -10 },
    { time:'17:51', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.14', weekday:'周一', items:[
    { time:'07:28', type:'in',       text:'刷卡入校' },
    { time:'11:50', type:'food',     text:'食堂',            delta:   -12 },
    { time:'17:35', type:'food',     text:'食堂',            delta:   -11 },
    { time:'20:05', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.15', weekday:'周二', items:[
    { time:'07:32', type:'in',       text:'刷卡入校' },
    { time:'11:45', type:'food',     text:'食堂',            delta:   -12 },
    { time:'17:30', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:36', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.16', weekday:'周三', items:[
    { time:'07:22', type:'in',       text:'刷卡入校' },
    { time:'11:55', type:'food',     text:'食堂',            delta:   -11 },
    { time:'15:40', type:'shop',     text:'小卖部',          delta:   -12 },
    { time:'17:32', type:'food',     text:'食堂',            delta:   -10 },
    { time:'20:18', type:'out',      text:'刷卡离校' }
  ]},
  { date:'2015.09.17', weekday:'周四', items:[
    { time:'07:20', type:'in',       text:'刷卡入校' },
    { time:'11:50', type:'food',     text:'食堂',            delta:   -14 },
    { time:'17:35', type:'food',     text:'食堂',            delta:   -11 },
    { time:'20:05', type:'out',      text:'刷卡离校' }
  ]}
];

const PAGE_URL = 'https://luchenyuecheng.github.io/LuChenCard/';

(function render(){
  let balance     = 0;
  let totalSpend  = 0;
  let totalCount  = 0;
  let totalEvents = 0;
  let html        = '';

  RECORDS.forEach(function(day, dayIndex){
    let daySpend = 0;

    const rows = day.items.map(function(item){
      totalEvents++;

      if (typeof item.delta === 'number') {
        balance += item.delta;
        if (item.delta < 0) {
          const cost = -item.delta;
          daySpend   += cost;
          totalSpend += cost;
          totalCount++;
        }
      }

      let amountHtml = '';
      if (typeof item.delta === 'number') {
        const isIncome = item.delta > 0;
        amountHtml =
          '<span class="amount ' + (isIncome ? 'plus' : 'minus') + '">' +
            (isIncome ? '+' : '-') + Math.abs(item.delta).toFixed(2) +
          '</span>';
      }

      return '<li class="item">' +
               '<span class="time">'   + item.time + '</span>' +
               '<span class="dot ' + item.type + '"></span>' +
               '<span class="text">'   + item.text + '</span>' +
               amountHtml +
             '</li>';
    }).join('');

    html +=
      '<section class="day" style="animation-delay:' + (dayIndex * 45) + 'ms">' +
        '<div class="day-head">' +
          '<span class="date">'    + day.date + '</span>' +
          '<span class="weekday">' + day.weekday + '</span>' +
          (daySpend > 0
            ? '<span class="day-total">支出 ¥' + daySpend.toFixed(2) + '</span>'
            : '') +
        '</div>' +
        '<ul class="items">' + rows + '</ul>' +
      '</section>';
  });

  document.getElementById('timeline').innerHTML = html;
  document.getElementById('balanceValue').textContent = balance.toFixed(2);
  document.getElementById('statSpend').textContent    = '¥' + totalSpend.toFixed(2);
  document.getElementById('statCount').textContent    = totalCount + ' 笔';
  document.getElementById('statDays').textContent     = RECORDS.length + ' 天';
  document.getElementById('footCount').textContent    = totalEvents;
  document.getElementById('dateRange').textContent    =
    RECORDS[0].date + ' — ' + RECORDS[RECORDS.length - 1].date;

  document.getElementById('qrUrl').textContent = PAGE_URL;
})();

(function buildQr(){
  const box = document.getElementById('qrBox');

  function fallback(){
    box.style.padding = '16px';
    box.style.fontSize = '10px';
    box.style.wordBreak = 'break-all';
    box.textContent = PAGE_URL;
  }

  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';

  script.onload = function(){
    try {
      new QRCode(box, {
        text: PAGE_URL,
        width: 170,
        height: 170,
        colorDark: '#0d3627',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      fallback();
    }
  };

  script.onerror = fallback;
  document.body.appendChild(script);
})();
</script>
</body>
</html>
